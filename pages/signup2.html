<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REAL REVIEW | Signup</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/signup2.css">
</head>
<body>
    <div class="signup-container">
        <div class="form-content">
            <div class="teal-header">
                <h1>REAL</h1>
                <h1>REVIEW</h1>
            </div>
            
            <div class="welcome-text">
                <h2>Create Account</h2>
                <h4>Join our community of reviewers</h4>
            </div>
            
            <div class="signup-options">
                <div class="google-signup">
                    <label for="google-signup">
                        <i class="fab fa-google google-icon"></i>
                        Sign up with Google
                    </label>
                </div>
                
                <div class="separator">
                    <span>Or</span>
                </div>
            </div>
            
            <form id="signupForm">
                <div class="input-group">
                    <label for="fullName">Full Name :</label>
                    <input type="text" id="fullName" class="input-field" placeholder="Enter your full name" required>
                </div>
                
                <div class="input-group">
                    <label for="email">Email :</label>
                    <input type="email" id="email" class="input-field" placeholder="Enter your email" required>
                </div>
                
                <div class="input-group">
                    <label for="password">Password :</label>
                    <input type="password" id="password" class="input-field" placeholder="Create a password" required>
                    
                    <div class="password-requirements">
                        <p>Password must contain:</p>
                        <ul>
                            <li id="req-length" class="invalid">At least 8 characters</li>
                            <li id="req-uppercase" class="invalid">One uppercase letter</li>
                            <li id="req-number" class="invalid">One number</li>
                            <li id="req-special" class="invalid">One special character</li>
                        </ul>
                    </div>
                </div>
                
                <div class="input-group">
                    <label for="confirmPassword">Confirm Password :</label>
                    <input type="password" id="confirmPassword" class="input-field" placeholder="Confirm your password" required>
                </div>
                
                <div class="terms-checkbox">
                    <input type="checkbox" id="terms" required>
                    <label for="terms">
                        I agree to the <a href="#" id="termsLink">Terms of Service</a> and <a href="#" id="privacyLink">Privacy Policy</a>
                    </label>
                </div>
                
                <button type="submit" class="signup-button">Create Account</button>
            </form>
            
            <div class="login-link">
                <p>Already have an account? <a href="login2.html">Login</a></p>
            </div>
        </div>
    </div>

    <script src="../js/signup2.js"></script>
</body>
</html>
